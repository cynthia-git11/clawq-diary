name: GEO Hourly (crawl-ping + health check)

# 每小时巡检 GEO 健康度（结构化数据 / XML / robots / 最新一篇同步 / 计数一致），
# 并把「上次成功推送以来」变更的公开页面推给 IndexNow（scripts/indexnow-ping.py；上次推送的 commit 存在 actions cache，
# 没有记录时退到 push 事件的 before，再退到最近 26 小时）。
# 只读内容、不改不空提交；巡检失败 → 工作流失败 + 写入固定 issue 提醒（IndexNow 推送失败不算巡检失败，下一次从同一基点重推）。
on:
  schedule:
    - cron: '0 * * * *'        # 每小时整点（UTC）
  push:
    branches: [ main ]
    paths:
      - '**.html'
      - '**.txt'
      - '**.xml'
      - 'archive/**'
  workflow_dispatch:
    inputs:
      full:
        description: 'Push every URL in the sitemaps to IndexNow (one-off full resubmission)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: geo-hourly
  cancel-in-progress: false

jobs:
  geo:
    name: GEO health check + crawl ping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the IndexNow base can be the last pushed commit, hours or days back

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: GEO health check (read-only)
        run: python3 scripts/geo-check.py

      - name: Restore the commit last pushed to IndexNow
        if: success()
        continue-on-error: true      # no cache → the ping falls back to github.event.before, then to the last 26 hours
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/clawq-indexnow
          key: indexnow-last-${{ github.sha }}
          restore-keys: indexnow-last-

      - name: Ping IndexNow with every page changed since the last successful push (Bing / Yandex / Seznam / Naver)
        id: ping
        if: success()
        continue-on-error: true      # a failed ping is retried next run; it is not a health-check failure
        env:
          BEFORE: ${{ github.event.before }}
          FULL: ${{ inputs.full && '--all' || '' }}
        run: python3 scripts/indexnow-ping.py --last-file "$HOME/.cache/clawq-indexnow/last-sha" --before "$BEFORE" --window-hours 26 $FULL

      - name: Remember the commit just pushed to IndexNow
        if: success() && steps.ping.outputs.advance == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/clawq-indexnow
          key: indexnow-last-${{ github.sha }}

      - name: Alert to a fixed issue on health-check failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = 'clawq-geo-alert';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const body = `GEO 健康巡检失败 — ${when} UTC\n\n结构化数据 / XML / robots / 最新一篇同步 / 计数 出现问题，详见运行日志：\n${run}\n\n（本任务只巡检、不自动改内容；请手动或让 Claude 修复后重跑。）`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: marker, state: 'open', per_page: 1
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ GEO 健康巡检告警', body, labels: [marker]
              });
            }
